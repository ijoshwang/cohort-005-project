name: Temporary image rate limit check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send two tiny images to Sol
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import struct
          import urllib.error
          import urllib.request
          import zlib

          def png(color):
              def chunk(kind, data):
                  return (struct.pack(">I", len(data)) + kind + data
                          + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff))
              pixels = b"".join(b"\0" + bytes(color) * 32 for _ in range(32))
              image = (b"\x89PNG\r\n\x1a\n"
                       + chunk(b"IHDR", struct.pack(">IIBBBBB", 32, 32, 8, 2, 0, 0, 0))
                       + chunk(b"IDAT", zlib.compress(pixels))
                       + chunk(b"IEND", b""))
              return "data:image/png;base64," + base64.b64encode(image).decode()

          body = {
              "model": "gpt-6.1-sol",
              "input": [{"role": "user", "content": [
                  {"type": "input_text", "text": "Reply OK."},
                  {"type": "input_image", "image_url": png((255, 0, 0)), "detail": "low"},
                  {"type": "input_image", "image_url": png((0, 0, 255)), "detail": "low"},
              ]}],
              "max_output_tokens": 64,
              "store": False,
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(body).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json",
              },
          )
          try:
              response = urllib.request.urlopen(request, timeout=90)
          except urllib.error.HTTPError as exc:
              response = exc
          result = json.loads(response.read().decode())
          print("HTTP status:", response.status)
          print("Request ID:", response.headers.get("x-request-id", "unavailable"))
          if response.status >= 400:
              print("API error:", json.dumps(result.get("error", result)))
          else:
              print("Two-image request accepted.")
          PY
